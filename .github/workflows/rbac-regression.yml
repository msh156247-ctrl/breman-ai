name: RBAC Regression

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  backend-rbac-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run RBAC regression tests
        run: python -m pytest -q tests/test_rbac_regression.py
